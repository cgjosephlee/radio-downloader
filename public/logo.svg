<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <style>
    path, rect { stroke: #1d1d1f; fill: none; }
    circle { fill: #1d1d1f; stroke: none; }
    @media (prefers-color-scheme: dark) {
      path, rect { stroke: #f5f5f7; }
      circle { fill: #f5f5f7; }
    }
  </style>
  <!-- Outer shell -->
  <rect x="2.5" y="5.5" width="19" height="13" rx="2" />
  <!-- Inner tape window -->
  <rect x="6.5" y="9.5" width="11" height="5" rx="1" />
  <!-- Left and Right reels -->
  <circle cx="9.5" cy="12" r="1.2" />
  <circle cx="14.5" cy="12" r="1.2" />
</svg>
